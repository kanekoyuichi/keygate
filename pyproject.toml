[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "secretgate"
version = "0.1.0"
description = "Git pre-commit hook for secret leak prevention"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
]

[project.scripts]
secretgate = "secretgate.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
